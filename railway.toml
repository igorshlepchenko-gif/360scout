[build]
builder = "nixpacks"
buildCommand = "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r backend/requirements.txt && playwright install chromium --with-deps"

[deploy]
startCommand = "cd backend && /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
